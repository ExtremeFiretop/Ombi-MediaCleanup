name: CI Build

on:
  push:
    branches: [ develop, master ]
  workflow_dispatch:

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: NodeModules Cache
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: node_modules-${{ hashFiles('**/yarn.lock') }}

      - name: UI Install
        run: yarn --cwd ./src/Ombi/ClientApp install

      - name: Build UI
        run: yarn --cwd ./src/Ombi/ClientApp run build

      - name: Run UI Tests
        run: yarn --cwd ./src/Ombi/ClientApp run test

      - name: Publish UI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angular_dist
          path: |
            ./src/Ombi/ClientApp/dist

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '8.0.x'

      - name: Nuget Cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget

      - name: Run Unit Tests
        run: |
          cd src
          dotnet test -c NonUiBuild --logger trx --results-directory "TestResults"

  versioning:
     runs-on: ubuntu-latest
     needs: [ build-ui, unit-test ]
     permissions:
      contents: write
     outputs:
      changelog: ${{ steps.changelog.outputs.clean_changelog }}
      tag: ${{ steps.changelog.outputs.tag }}
      version: ${{ steps.changelog.outputs.version }}
     steps:
       - uses: actions/checkout@v4
         with:
          fetch-depth: 0

       - name: Verify release tag baseline
         shell: bash
         run: |
           set -euo pipefail
           git fetch --force --tags origin

           file_version="$(python3 -c 'import json; print(json.load(open("version.json", encoding="utf-8"))["version"])')"
           latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"

           echo "version.json: $file_version"
           if [[ -z "$latest_tag" ]]; then
             echo "No existing semantic release tag found; the changelog action will use its fallback version."
             exit 0
           fi

           tag_version="${latest_tag#v}"
           echo "Latest semantic release tag: $latest_tag"

           python3 - "$file_version" "$tag_version" <<'PY'
           import re
           import sys

           pattern = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")

           def parse(value):
               match = pattern.fullmatch(value)
               if not match:
                   raise SystemExit(f"Invalid release version: {value}")
               return tuple(int(part) for part in match.groups())

           file_version, tag_version = sys.argv[1], sys.argv[2]
           file_semver, tag_semver = parse(file_version), parse(tag_version)

           if file_semver > tag_semver:
               print(
                   f"::error::version.json ({file_version}) is ahead of the latest release tag "
                   f"(v{tag_version}). Git tags are the release source of truth; refusing to "
                   "silently move the tracked version backward."
               )
               raise SystemExit(1)

           if file_semver < tag_semver:
               print(
                   f"::warning::version.json ({file_version}) is behind the latest release tag "
                   f"(v{tag_version}). The release will be calculated from Git tags and "
                   "version.json will be repaired in the release commit."
               )
           else:
               print("Release tag and version.json are aligned.")
           PY

       - name: Conventional Changelog Action
         id: changelog
         uses: TriPSs/conventional-changelog-action@v3
         with:
          version-file: 'version.json'
          skip-version-file: 'true'
          pre-commit: '.github/scripts/release-precommit.js'
          release-count: 40
          skip-on-empty: 'false'
          git-message: 'chore(release): :rocket: {version}'

       - name: Output version
         run: |
           echo "outputs: ${{ steps.changelog.outputs.tag }}"
           echo "Version: ${{ steps.changelog.outputs.version }}"

  publish:
    runs-on: ubuntu-latest
    needs: [ build-ui, versioning ]
    strategy:
      matrix:
        include:
          - os: win-x64
            format: zip
            compression: zip
          - os: win-x86
            format: zip
            compression: zip
          - os: linux-x64
            format: tar.gz
            compression: tar
          - os: linux-arm
            format: tar.gz
            compression: tar
          - os: linux-arm64
            compression: tar
            format: tar.gz
          - os: osx-x64
            compression: tar
            format: tar.gz
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '5.0.x'

      - name: Nuget Cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget

      - name: Set Backend Version
        run: |
          dotnet tool install -g dotnet-setversion
          setversion -r ${{ needs.versioning.outputs.version }}
        working-directory: src

      - name: Publish Backend ${{ matrix.os }}
        run: dotnet publish -c Release -r ${{ matrix.os }} -o "${{ matrix.os }}" --self-contained true -p:PublishSingleFile=true
        working-directory: src/Ombi

      - name: Publish Updater ${{ matrix.os }}
        run: dotnet publish -c Release -r ${{ matrix.os }} -o "../Ombi/${{ matrix.os }}/updater" --self-contained true -p:PublishSingleFile=true
        working-directory: src/Ombi.Updater

      - name: Verify Packaged Updater ${{ matrix.os }}
        shell: bash
        run: |
          updater="src/Ombi/${{ matrix.os }}/updater/Ombi.Updater"
          if [[ "${{ matrix.os }}" == win-* ]]; then
            updater="${updater}.exe"
          fi
          test -f "$updater" || { echo "Missing packaged updater: $updater"; exit 1; }

      - name: Download Angular
        uses: actions/download-artifact@v4
        with:
          name: angular_dist
          path: ~/src/Ombi/dist

      - name: Copy Dist to Artifacts
        run: |
          cd ${{ matrix.os }}
          sudo mkdir -p ClientApp/dist
          echo "mkdir /ClientApp"
          echo "list os (ClientApp should be here)"
          ls
          cd ..
          echo "Copy dist to /ClientApp"
          sudo mv ~/src/Ombi/dist/* ${{ matrix.os }}/ClientApp/dist
        working-directory: src/Ombi

      - name: Archive Release
        uses: thedoctor0/zip-release@master
        with:
          type: '${{ matrix.compression }}'
          filename: '../${{ matrix.os }}.${{ matrix.format }}'
          path: '.'
          directory: 'src/Ombi/${{ matrix.os }}'

      - name: Publish Release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            ./src/Ombi/${{ matrix.os }}.${{ matrix.format }}

  release:
    needs: [ publish, unit-test, versioning ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Download Artifacts
        id: download
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Reqestra Stable Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/master'
        with:
          body: ${{ needs.versioning.outputs.changelog }}
          name: ${{ needs.versioning.outputs.tag }}
          tag_name: ${{ needs.versioning.outputs.tag }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip

      - name: Publish Reqestra Develop Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/develop'
        with:
          prerelease: true
          generate_release_notes: false
          body: ${{ needs.versioning.outputs.changelog }}
          name: ${{ needs.versioning.outputs.tag }}
          tag_name: ${{ needs.versioning.outputs.tag }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip

  docker:
    needs: [ unit-test, versioning ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ needs.versioning.outputs.version }},enable=${{ needs.versioning.outputs.version != '' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/dockerfile
          push: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.versioning.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
